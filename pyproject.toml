[project]
name = "patient-facing-xai-figures"
version = "0.1.0"
description = "Figures for a systematic scoping review of patient-facing explainability in medical AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "nbstripout>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
